<VirtualHost *:80>
    # Reemplaza por el dominio o la IP real del servidor de destino.
    ServerName CAMBIAR-por-dominio-o-ip

    # Reemplaza por la ruta real donde se clonó el proyecto en ESTE servidor.
    DocumentRoot /ruta/a/tarjetas-prestamo/public

    SetEnv APP_ENV prod

    <Directory /ruta/a/tarjetas-prestamo/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Bloquea cualquier intento de servir algo fuera de /public por si
    # DocumentRoot cambiara por error en el futuro.
    <DirectoryMatch "^/ruta/a/tarjetas-prestamo/(?!public/)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/tarjetas-prestamo-error.log
    CustomLog ${APACHE_LOG_DIR}/tarjetas-prestamo-access.log combined
</VirtualHost>
